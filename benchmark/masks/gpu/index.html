<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mask GPU Benchmark</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #080b0f;
        color: #e5edf5;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 16px;
        max-width: 1100px;
      }

      #stage {
        height: 360px;
        overflow: hidden;
        border: 1px solid #263241;
        background: #05070a;
      }

      #stage canvas {
        display: block;
        height: 100%;
        width: 100%;
      }

      pre {
        overflow: auto;
        border: 1px solid #263241;
        border-radius: 8px;
        padding: 16px;
        background: #111820;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mask GPU Benchmark</h1>
      <p id="status">Preparing benchmark...</p>
      <div id="stage"></div>
      <pre id="output"></pre>
    </main>
    <script type="module" src="/benchmark/masks/gpu/src/main.ts"></script>
  </body>
</html>
