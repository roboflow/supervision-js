name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: Select latest for a stable release; use next only for an explicit prerelease or canary.
        required: true
        default: latest
        type: choice
        options:
          - next
          - latest
      recovery_run_id:
        description: "Recovery only: failed Publish npm package run ID after npm upload succeeded."
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Verify and publish supervision and its video engine
    runs-on: ubuntu-latest
    environment:
      name: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release source
        id: release_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          release_sha="${GITHUB_SHA}"

          if [[ -n "${RECOVERY_RUN_ID}" ]]; then
            if ! [[ "${RECOVERY_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "recovery_run_id must be a GitHub Actions run ID." >&2
              exit 1
            fi

            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}")"
            workflow_name="$(jq --raw-output '.name' <<<"${run}")"
            event="$(jq --raw-output '.event' <<<"${run}")"
            head_branch="$(jq --raw-output '.head_branch' <<<"${run}")"
            conclusion="$(jq --raw-output '.conclusion' <<<"${run}")"
            release_sha="$(jq --raw-output '.head_sha' <<<"${run}")"

            if [[ "${workflow_name}" != "Publish npm package" \
              || "${event}" != "workflow_dispatch" \
              || "${head_branch}" != "main" \
              || "${conclusion}" != "failure" \
              || ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "recovery_run_id must identify a failed Publish npm package dispatch from main." >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "${release_sha}" origin/main; then
              echo "Recovery run head ${release_sha} is not reachable from main." >&2
              exit 1
            fi

            git checkout --detach "${release_sha}"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "recovery=$([[ -n "${RECOVERY_RUN_ID}" ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify repository
        run: npm run verify

      - name: Build portable tarball
        run: npm run package:tarball

      - name: Build video engine tarball
        run: npm run package:engine:tarball

      - name: Smoke-test clean consumer
        run: npm run package:tarball:smoke

      - name: Publish video engine tarball
        id: publish_engine
        shell: bash
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          RECOVERY: ${{ steps.release_source.outputs.recovery }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/video-engine/package.json').version")"

          if published_version="$(npm view "supervision-js-video-engine@${version}" version 2>/dev/null)"; then
            if [[ "${published_version}" != "${version}" ]]; then
              echo "Unexpected published version for supervision-js-video-engine@${version}: ${published_version}" >&2
              exit 1
            fi

            echo "supervision-js-video-engine@${version} is already published; this release does not change it."
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${DIST_TAG}" == "latest" && "${version}" == *-* ]]; then
            echo "Prerelease version ${version} must use the next tag." >&2
            exit 1
          fi

          if [[ "${DIST_TAG}" == "next" && "${version}" != *-* ]]; then
            echo "Stable version ${version} must use the latest tag." >&2
            exit 1
          fi

          # The engine publishes ahead of the step that rejects an
          # unpublishable recovery source, so it rejects that source itself.
          if [[ "${RECOVERY}" == "true" ]]; then
            web_version="$(node -p "require('./packages/web/package.json').version")"

            if ! npm view "supervision@${web_version}" version >/dev/null 2>&1; then
              echo "Recovery run's supervision@${web_version} is not published; refusing to publish a recovery source." >&2
              exit 1
            fi
          fi

          shopt -s nullglob
          archives=(artifacts/engine/supervision-js-video-engine-*.tgz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one generated supervision-js-video-engine tarball." >&2
            exit 1
          fi
          npm publish "./${archives[0]}" --access public --tag "${DIST_TAG}"
          echo "published=true" >> "${GITHUB_OUTPUT}"

      - name: Publish generated tarball
        shell: bash
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          RECOVERY: ${{ steps.release_source.outputs.recovery }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/web/package.json').version")"

          if [[ "${DIST_TAG}" == "latest" && "${version}" == *-* ]]; then
            echo "Prerelease version ${version} must use the next tag." >&2
            exit 1
          fi

          if [[ "${DIST_TAG}" == "next" && "${version}" != *-* ]]; then
            echo "Stable version ${version} must use the latest tag." >&2
            exit 1
          fi

          if published_version="$(npm view "supervision@${version}" version 2>/dev/null)"; then
            if [[ "${published_version}" != "${version}" ]]; then
              echo "Unexpected published version for supervision@${version}: ${published_version}" >&2
              exit 1
            fi

            if [[ "${RECOVERY}" != "true" ]]; then
              echo "supervision@${version} is already published. To recover its GitHub Release, dispatch this workflow from main with recovery_run_id set to the failed Publish npm package run ID." >&2
              exit 1
            fi

            echo "supervision@${version} is already published; continuing the verified run recovery."
            exit 0
          fi

          if [[ "${RECOVERY}" == "true" ]]; then
            echo "Recovery run's supervision@${version} is not published; refusing to publish a recovery source." >&2
            exit 1
          fi

          shopt -s nullglob
          archives=(artifacts/supervision-*.tgz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one generated supervision tarball." >&2
            exit 1
          fi
          npm publish "./${archives[0]}" --access public --tag "${DIST_TAG}"

      - name: Verify published video engine dist-tag
        if: steps.publish_engine.outputs.published == 'true'
        shell: bash
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/video-engine/package.json').version")"

          for attempt in {1..12}; do
            published_version="$(npm view "supervision-js-video-engine@${DIST_TAG}" version 2>/dev/null || true)"
            if [[ "${published_version}" == "${version}" ]]; then
              exit 0
            fi

            if [[ "${attempt}" -lt 12 ]]; then
              echo "Waiting for supervision-js-video-engine@${DIST_TAG} to resolve to ${version} (attempt ${attempt}/12)."
              sleep 5
            fi
          done

          echo "supervision-js-video-engine@${DIST_TAG} did not resolve to ${version} after 60 seconds; saw ${published_version:-nothing}." >&2
          exit 1

      - name: Verify published npm dist-tag
        shell: bash
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/web/package.json').version")"

          # The upload API can acknowledge a publish before npm's dist-tag
          # read endpoint reflects it. Poll briefly so a successful publish
          # cannot strand its immutable version without a GitHub release.
          for attempt in {1..12}; do
            published_version="$(npm view "supervision@${DIST_TAG}" version 2>/dev/null || true)"
            if [[ "${published_version}" == "${version}" ]]; then
              exit 0
            fi

            if [[ "${attempt}" -lt 12 ]]; then
              echo "Waiting for supervision@${DIST_TAG} to resolve to ${version} (attempt ${attempt}/12)."
              sleep 5
            fi
          done

          echo "supervision@${DIST_TAG} did not resolve to ${version} after 60 seconds; saw ${published_version:-nothing}." >&2
          exit 1

      - name: Create or verify release tag
        if: inputs.dist_tag == 'latest'
        shell: bash
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/web/package.json').version")"
          tag="v${version}"
          release_sha="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if [[ "${tag_sha}" != "${release_sha}" ]]; then
              echo "Existing ${tag} points to ${tag_sha}, not ${release_sha}." >&2
              exit 1
            fi

            echo "Git tag ${tag} already points to the release commit."
            exit 0
          fi

          git tag --annotate "${tag}" "${release_sha}" --message "supervision ${tag}"
          git push "https://x-access-token:${RELEASE_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}"

      - name: Create GitHub Release
        if: inputs.dist_tag == 'latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/web/package.json').version")"
          tag="v${version}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
            exit 0
          fi

          gh release create "${tag}" \
            --title "supervision ${tag}" \
            --generate-notes
